<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Redução do wordmark: em 32px "DO VALE" seria ilegível, então
       fica o monograma DV com a mesma barra laranja de acento. -->
  <rect width="32" height="32" fill="#121519"/>
  <rect x="0" y="0" width="3" height="32" fill="#e85d04"/>
  <text x="18.5" y="22.5" text-anchor="middle"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="16" font-weight="800" letter-spacing="-0.5" fill="#ffffff">DV</text>
</svg>
